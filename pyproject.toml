[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "globalmacro"
version = "0.1.0"
description = "Producer of the Global Macroeconomic futures returns datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # rt64 extra pulls polars-runtime-64: the LSEG tick trades CSVs exceed 2**32
    # rows, which the default 32-bit-index runtime cannot materialize (baseline was
    # built with the 64-bit-index runtime; dropping it silently broke tickhistory).
    "polars[rt64]==1.35.2",
    "pandas==2.3.2",
    "numpy==2.0.2",
    "pyarrow==21.0.0",
    "pyyaml==6.0.2",
    "pandas-market-calendars>=5.2.4",
    "tqdm>=4.67.1",
    "matplotlib==3.9.4",
    "wrds>=3.1.6",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
globalmacro = "globalmacro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/globalmacro"]

[dependency-groups]
dev = ["pytest>=8", "black==25.1.0", "ipykernel==6.30.1", "debugpy==1.8.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
